; Vector firmware project.
; Right now it only has the "native" environment: the packet library and its
; tests run on your computer, with no hardware. Boards are added in task 11.
;
;   Run the tests:   pio test -e native

[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I${PROJECT_DIR}/../protocol
